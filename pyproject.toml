[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "pricing-recommendation-engine"
version = "0.1.0"
description = "Production-grade dynamic pricing recommendation service for nightly rentals."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Miguel Angel Sierra Hayer" }]
keywords = ["dynamic-pricing", "machine-learning", "fastapi", "mlflow", "lightgbm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "pandas>=2.2,<3.0",
  "numpy>=1.26,<3.0",
  "scikit-learn>=1.5,<2.0",
  "lightgbm>=4.5,<5.0",
  "shap>=0.46,<1.0",
  "numba>=0.66,<0.67",
  "mlflow>=3.0,<4.0",
  "pandera>=0.22,<1.0",
  "typer>=0.15,<1.0",
  "structlog>=24.4,<26.0",
  "prometheus-client>=0.21,<1.0",
  "joblib>=1.4,<2.0",
]

[project.urls]
Repository = "https://github.com/Miguesh/pricing-recommendation-engine-"
Issues = "https://github.com/Miguesh/pricing-recommendation-engine-/issues"
Documentation = "https://github.com/Miguesh/pricing-recommendation-engine-#readme"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
  "pandas-stubs>=2.2",
  "pre-commit>=4.0,<5.0",
  "types-requests>=2.32.0.20241016",
]

[project.scripts]
pricing-engine = "pricing_engine.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pricing_engine"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["pricing_engine"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["pricing_engine"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["joblib", "lightgbm.*", "mlflow.*", "pandera.*", "shap.*", "sklearn.*"]
ignore_missing_imports = true
