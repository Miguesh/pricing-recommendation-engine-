name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.9.15"

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install locked environment
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked --extra dev --python "${{ matrix.python-version }}"

      - name: Security and style lint
        if: matrix.python-version == '3.12'
        run: uv run ruff check .

      - name: Format check
        if: matrix.python-version == '3.12'
        run: uv run ruff format --check .

      - name: Strict type check
        if: matrix.python-version == '3.12'
        run: uv run mypy src

      - name: Stable statistical contract and OpenAPI snapshot
        if: matrix.python-version == '3.12'
        run: |
          uv run pricing-engine validate --input tests/fixtures/statistical/plusbnb-consumer.synthetic.json
          uv run pricing-engine recommend --input tests/fixtures/statistical/plusbnb-consumer.synthetic.json > "${RUNNER_TEMP}/statistical-response.json"
          uv run pricing-engine export-openapi --output "${RUNNER_TEMP}/openapi.json"
          diff --unified docs/openapi.json "${RUNNER_TEMP}/openapi.json"

      - name: Dependency consistency
        run: uv pip check

      - name: Test and enforce coverage
        run: uv run pytest --cov=pricing_engine --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  package:
    name: Build and clean-install package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build distributions from locked source
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv build --no-sources

      - name: Clean-install and import production entry points
        run: |
          uv venv .package-venv --python 3.12
          uv pip install --python .package-venv/bin/python dist/*.whl
          uv pip check --python .package-venv/bin/python
          .package-venv/bin/python -c "from pricing_engine.cli import app; from pricing_engine.interfaces.api.app import create_app; from pricing_engine.infrastructure.models.lightgbm_demand import QuantileLightGBMDemandModel; assert app and create_app and QuantileLightGBMDemandModel"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  containers:
    name: Container end-to-end smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality
    env:
      CI_EXPERIMENT_NAME: pricing-demand-ci-${{ github.run_id }}-${{ github.run_attempt }}
      CI_MODEL_NAME: pricing-demand-ci
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure integration workspace
        run: echo "CI_WORK_DIR=${RUNNER_TEMP}/pricing-engine-ci" >> "${GITHUB_ENV}"

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build API and MLflow images
        run: docker compose build api mlflow

      - name: Smoke-test image entry points
        run: |
          docker run --rm --entrypoint python pricing-recommendation-engine-api:local -c "from pricing_engine.cli import app; from pricing_engine.interfaces.api.app import create_app; assert app and create_app"
          docker run --rm pricing-recommendation-engine-api:local pricing-engine capabilities
          test "$(docker run --rm --entrypoint uv pricing-recommendation-engine-api:local --version)" = "uv ${UV_VERSION}"
          docker run --rm --entrypoint mlflow pricing-recommendation-engine-mlflow:local --version

      - name: Start MLflow infrastructure without API
        run: |
          install -d -m 0777 "${CI_WORK_DIR}"
          mkdir -p artifacts
          docker compose up -d --wait --wait-timeout 180 postgres minio create-bucket mlflow

      - name: Train and register candidate through the API image
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-connrefused --retry-delay 2 --max-time 10 \
            http://127.0.0.1:5000/health

          docker compose run --rm --no-deps -T \
            --volume "${CI_WORK_DIR}:/work" \
            api pricing-engine generate-demo-data \
            --output /work/demo.csv \
            --properties 6 \
            --decision-days 180 \
            --seed 42

          docker compose run --rm --no-deps -T \
            --volume "${CI_WORK_DIR}:/work" \
            api pricing-engine retrain \
            --input /work/demo.csv \
            --experiment-name "${CI_EXPERIMENT_NAME}" \
            --registered-model-name "${CI_MODEL_NAME}" \
            > "${CI_WORK_DIR}/retrain.json"

          cat "${CI_WORK_DIR}/retrain.json"
          candidate_version="$(
            jq -er '.candidate.model_version | select(type == "string" and length > 0)' \
              "${CI_WORK_DIR}/retrain.json"
          )"
          echo "CANDIDATE_VERSION=${candidate_version}" >> "${GITHUB_ENV}"

      - name: Promote candidate explicitly
        run: |
          docker compose run --rm --no-deps -T \
            api pricing-engine promote \
            --version "${CANDIDATE_VERSION}" \
            --approved-by "GitHub Actions CI" \
            --registered-model-name "${CI_MODEL_NAME}"

      - name: Configure and start champion API
        run: |
          cat > .env <<'EOF'
          PRICING_ENVIRONMENT=local
          PRICING_MODEL_URI=models:/pricing-demand-ci@champion
          PRICING_SERVING_TENANT_ID=demo-tenant
          EOF
          docker compose up -d --no-deps api

      - name: Verify serving and governance contracts
        run: |
          curl --fail --silent --show-error \
            --retry 15 --retry-all-errors --retry-delay 2 --max-time 15 \
            http://127.0.0.1:8000/health/live
          curl --fail --silent --show-error \
            --retry 15 --retry-all-errors --retry-delay 2 --max-time 15 \
            http://127.0.0.1:8000/health/ready

          cat > "${CI_WORK_DIR}/request.json" <<'EOF'
          {
            "tenant_id": "demo-tenant",
            "property_id": "property-000",
            "stay_date": "2026-08-15",
            "as_of_date": "2026-07-18",
            "currency": "USD",
            "current_price": "125.00",
            "historical_occupancy_7d": 0.72,
            "booking_pace_7d": 0.35,
            "competitor_price_median": "130.00",
            "bedrooms": 2,
            "accommodates": 4,
            "review_score": 4.7,
            "is_holiday": false,
            "event_intensity": 1.0,
            "latitude": 25.7617,
            "longitude": -80.1918,
            "constraints": {
              "min_price": "90.00",
              "max_price": "170.00",
              "price_increment": "5.00",
              "max_price_change_pct": "0.20",
              "min_expected_occupancy": 0.20
            }
          }
          EOF

          curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data-binary "@${CI_WORK_DIR}/request.json" \
            http://127.0.0.1:8000/v1/pricing/recommendations \
            > "${CI_WORK_DIR}/recommendation.json"
          cat "${CI_WORK_DIR}/recommendation.json"
          jq -e '
            (.recommended_price | tonumber) > 0 and
            (.expected_revenue | tonumber) > 0 and
            (.expected_occupancy >= 0 and .expected_occupancy <= 1) and
            (.expected_occupancy_interval | length == 2) and
            (.confidence_score >= 0 and .confidence_score <= 100) and
            (.model_version | type == "string" and length > 0) and
            (.explanation | type == "string" and length > 0) and
            (.local_feature_contributions | type == "array" and length > 0) and
            (.global_feature_importance | type == "array" and length > 0)
          ' "${CI_WORK_DIR}/recommendation.json"

          docker compose exec -T \
            --env CI_EXPERIMENT_NAME="${CI_EXPERIMENT_NAME}" \
            --env CI_MODEL_NAME="${CI_MODEL_NAME}" \
            --env CANDIDATE_VERSION="${CANDIDATE_VERSION}" \
            api python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          import mlflow
          from mlflow import MlflowClient
          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name

          tracking_uri = "http://mlflow:5000"
          mlflow.set_tracking_uri(tracking_uri)
          mlflow.set_registry_uri(tracking_uri)
          client = MlflowClient(tracking_uri=tracking_uri, registry_uri=tracking_uri)
          experiment = client.get_experiment_by_name(os.environ["CI_EXPERIMENT_NAME"])
          assert experiment is not None
          assert experiment.artifact_location.startswith("mlflow-artifacts:")

          model_name = os.environ["CI_MODEL_NAME"]
          expected_version = os.environ["CANDIDATE_VERSION"]
          registered_model = client.get_registered_model(model_name)
          assert registered_model.tags["tenant_id"] == "demo-tenant"
          assert registered_model.tags["currency"] == "USD"
          scope_hash = registered_model.tags["tenant_scope_hash"]
          assert len(scope_hash) == 64
          assert all(character in "0123456789abcdef" for character in scope_hash)

          model_version = client.get_model_version(model_name, expected_version)
          assert model_version.tags["tenant_id"] == "demo-tenant"
          assert model_version.tags["currency"] == "USD"
          assert model_version.tags["tenant_scope_hash"] == scope_hash
          assert model_version.tags["promotion_gate"] == "passed"
          assert model_version.tags["lifecycle"] == "champion"
          assert model_version.tags["approval_status"] == "approved"
          assert model_version.tags["approved_by"] == "GitHub Actions CI"
          assert model_version.tags["champion_decision"] == "promotion"
          checksum = model_version.tags["model_content_hash"]
          assert len(checksum) == 64
          assert all(character in "0123456789abcdef" for character in checksum)
          run = client.get_run(model_version.run_id)
          assert run.info.status == "FINISHED"
          assert run.data.params["promotion_gate"] == "passed"
          assert run.data.params["model_content_hash"] == checksum

          model_dir = Path(
              mlflow.artifacts.download_artifacts(
                  artifact_uri=f"models:/{model_name}/{expected_version}",
                  tracking_uri=tracking_uri,
                  registry_uri=tracking_uri,
              )
          )
          lock_path = model_dir / "uv.lock"
          requirements_path = model_dir / "requirements.txt"
          assert lock_path.is_file()
          assert requirements_path.is_file()
          lock = tomllib.loads(lock_path.read_text(encoding="utf-8"))
          locked_versions: dict[str, set[str]] = {}
          for package in lock["package"]:
              name = canonicalize_name(package["name"])
              locked_versions.setdefault(name, set()).add(package["version"])
          requirements = {
              canonicalize_name(requirement.name): requirement
              for line in requirements_path.read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.lstrip().startswith(("#", "-"))
              for requirement in [Requirement(line)]
          }
          for dependency in (
              "joblib",
              "lightgbm",
              "numba",
              "pandas",
              "scikit-learn",
              "shap",
          ):
              requirement = requirements[dependency]
              assert str(requirement.specifier) in {
                  f"=={version}" for version in locked_versions[dependency]
              }

          champion = client.get_model_version_by_alias(model_name, "champion")
          assert str(champion.version) == expected_version
          print("MLflow artifact proxy, integrity, tenant, currency, and alias checks passed.")
          PY

      - name: Reject an untrusted Host on the MLflow API
        run: |
          rejection_status="$(curl --silent --show-error \
            --output "${CI_WORK_DIR}/mlflow-host-rejection.txt" \
            --write-out '%{http_code}' \
            --header 'Host: evil.example' \
            --header 'Content-Type: application/json' \
            --data '{}' \
            http://127.0.0.1:5000/api/2.0/mlflow/experiments/search)"
          cat "${CI_WORK_DIR}/mlflow-host-rejection.txt"
          if [ "${rejection_status}" != "403" ]; then
            echo "Expected MLflow API to reject an untrusted Host with 403; received ${rejection_status}."
            exit 1
          fi

      - name: Capture Compose diagnostics
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --timestamps postgres minio create-bucket mlflow api
          if [ -f "${CI_WORK_DIR}/retrain.json" ]; then
            cat "${CI_WORK_DIR}/retrain.json"
          fi

      - name: Tear down integration stack
        if: always()
        run: docker compose down -v --remove-orphans --timeout 30
